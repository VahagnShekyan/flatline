name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to the PowerShell Gallery
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $manifest = Test-ModuleManifest -Path ./src/Flatline/Flatline.psd1
          if ($manifest.Version.ToString() -ne $tag) {
            throw "Tag $tag does not match manifest version $($manifest.Version)."
          }

      - name: Lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) { $results | Format-Table -AutoSize; throw "PSScriptAnalyzer found $($results.Count) issue(s)." }

      - name: Test
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Publish
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set.' }
          Publish-Module -Path ./src/Flatline -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
